name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "👑 Anh Tú • DNS Locket Gold VIP 2099 (${{ github.ref_name }} - Video Vô Cực & Pure XML)"
          body: |
            ## 👑 Anh Tú • DNS Locket Gold 2099 VIP (${{ github.ref_name }})
            Tác giả: **Nguyễn Ngọc Anh Tú** (@z3rokaze / K4Z3X0R)

            ### ✨ Các Cải Tiến Cốt Lõi:
            - ♾️ **Video Vô Cực (Infinity 9999s Flex)**: Mở toang thanh cắt video Album (Video Trimmer Slider) và camera vô hạn để tha hồ flex giao diện; quay 10s - 15s gửi siêu tốc không bao giờ nghẽn server.
            - 📄 **Định Dạng XML Chuẩn Apple (Không Mã Hóa Nhị Phân)**: Xuất file XML Plist thuần túy (`<!DOCTYPE plist...`), hủy bỏ hoàn toàn binary plist `bplist00` bảo đảm tương thích 100% mọi iOS.
            - ⚡ **Khắc Phục 100% Lag DNS & Delay Tin Nhắn Zalo**: Kết nối qua Anycast Cloudflare tốc độ cao (độ trễ < 10ms tại VN), không delay tin nhắn Zalo.
            - 🎵 **Khắc Phục 100% Lỗi Mất Mạng Spotify**: Chứng chỉ TLS hợp lệ, kết nối mượt mà, không báo ngoại tuyến, skip không giới hạn.
            - 📺 **Khắc Phục 100% Lỗi YouTube**: Không can thiệp luồng phát video, xem video mượt mà full tốc độ 4K.
            - 💛 **Mở Khóa Full Locket Gold 2099**: Full 35 bộ lọc máy ảnh (Hello Kitty, Shin, Aesthetic), Nhãn dán thời tiết & Micrô ghi âm.
          files: |
            DNS.mobileconfig
