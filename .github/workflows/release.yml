name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cleanup older Anh Tu v3.* releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_TAG="${{ github.ref_name }}"
          for tag in $(gh release list --limit 50 --json tagName --jq '.[].tagName'); do
            if [[ "$tag" == v3.* && "$tag" != "$CURRENT_TAG" && "$tag" != "v3.0.4" ]]; then
              echo "Deleting old release: $tag"
              gh release delete "$tag" --yes --cleanup-tag || true
            fi
          done

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "👑 Anh Tú • DNS Locket Gold 2099 (${{ github.ref_name }})"
          body: |
            ## 👑 Anh Tú • DNS Locket Gold 2099 (${{ github.ref_name }})
            Tác giả: **Nguyễn Ngọc Anh Tú** (@z3rokaze / K4Z3X0R)

            ### ✨ Tính Năng Cốt Lõi:
            - 💛 **Mở Khóa Locket Gold 2099**: Video 45s/60s, 35 bộ lọc máy ảnh VIP, Thời tiết & Mic ghi âm.
            - ⚡ **Máy Chủ VPS Singapore (13.229.210.222)**: DNS DoH siêu tốc độ, không delay Zalo, không lag mạng.
            - 🔒 **Định Dạng XML Chuẩn Apple**: Tương thích 100% mọi iOS.
          files: |
            DNS.mobileconfig
