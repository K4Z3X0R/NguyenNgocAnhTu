name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cleanup older Anh Tu v3.* releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_TAG="${{ github.ref_name }}"
          for tag in $(gh release list --limit 50 --json tagName --jq '.[].tagName'); do
            if [[ "$tag" == v3.* && "$tag" != "$CURRENT_TAG" && "$tag" != "v3.0.4" ]]; then
              echo "Deleting old release: $tag"
              gh release delete "$tag" --yes --cleanup-tag || true
            fi
          done

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "👑 Anh Tú • DNS Locket Gold 2099 (${{ github.ref_name }})"
          body: |
            ## 👑 Anh Tú • DNS Locket Gold 2099 (${{ github.ref_name }})
            Tác giả: **Nguyễn Ngọc Anh Tú** (@z3rokaze / K4Z3X0R)

            ### ✨ Danh Sách 2 Bản Cấu Hình DNS Cập Nhật:
            - ⚡ **Bản 1 (`DNS.mobileconfig`)**: Máy Chủ VPS Singapore (`13.229.210.222`), DoH siêu tốc độ, mở khóa hơn 60 entitlements Locket Gold 2099, không delay Zalo, không lag mạng, hỗ trợ Spotify & chặn quảng cáo.
            - ⚡ **Bản 2 (`NguyenNgocAnhTu_LocketGold_DNS.mobileconfig`)**: Chuẩn hóa từ Kw Shop, định tuyến DoH `doh.2707226.xyz`, chuẩn hóa Apple XML Plist RFC 100%, UUID v4 mới, mở rộng đầy đủ domain RevenueCat.
            - 🔒 **Định Dạng XML Chuẩn Apple**: Tương thích 100% mọi iOS (iOS 16, 17, 18).
            - 💬 **Hỗ Trợ & Liên Hệ**: [Facebook](https://www.facebook.com/NguyenNgocAnhTu.VN) • [Zalo](https://zalo.me/0332413262) (0332413262).
          files: |
            DNS.mobileconfig
            NguyenNgocAnhTu_LocketGold_DNS.mobileconfig
