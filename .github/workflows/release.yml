name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "👑 Anh Tú • DNS Locket Gold VIP 2099 + Chặn QC Spotify (${{ github.ref_name }})"
          body: |
            ## 👑 Anh Tú • DNS Locket Gold 2099 VIP + Chặn QC Spotify (${{ github.ref_name }})
            Tác giả: **Nguyễn Ngọc Anh Tú** (@z3rokaze / K4Z3X0R)

            ### ✨ Các Cải Tiến Cốt Lõi:
            - 🎵 **Chặn 100% Quảng Cáo Spotify & Miễn Nhiễm Mất Mạng (Surgical Split-Horizon)**:
              - Tích hợp 7 cụm `*-spclient.spotify.com` (MITM TLS hợp lệ) + 17 cụm Audio Ads & Podcast Ads (`ads-fa`, `gads`, `podcastads`, `audio-sp-*.pscdn.co` chặn `NXDOMAIN` trực tiếp).
              - Tuyệt đối để `apresolve.spotify.com` và `dealer.spotify.com` kết nối trực tiếp (DIRECT) -> Giữ trạng thái Online 100%, xóa sổ vĩnh viễn lỗi *"Hiện tại bạn không có kết nối mạng"*.
            - 🎬 **Khắc Phục Triệt Để Lỗi Video Về 5s (Chuẩn 60.0s Max Kịch Trần)**: Đồng bộ chuẩn định dạng số thực `60.0` / `"60.0"` vượt qua bộ kiểm tra biên `0 < duration <= 60.0` của Locket iOS, chấm dứt 100% hiện tượng tràn số `9999s` bị phạt lùi về `5s`.
            - 📄 **Định Dạng XML Chuẩn Apple (Không Mã Hóa Nhị Phân)**: Xuất file XML Plist thuần túy (`<!DOCTYPE plist...`), hủy bỏ hoàn toàn binary plist `bplist00` bảo đảm tương thích 100% mọi iOS.
            - ⚡ **Khắc Phục 100% Lag DNS & Delay Tin Nhắn Zalo**: Kết nối qua Anycast Cloudflare tốc độ cao (độ trễ < 10ms tại VN), không delay tin nhắn Zalo.
            - 📺 **Khắc Phục 100% Lỗi YouTube**: Không can thiệp luồng phát video, xem video mượt mà full tốc độ 4K.
            - 💛 **Mở Khóa Full Locket Gold 2099**: Full 35 bộ lọc máy ảnh (Hello Kitty, Shin, Aesthetic), Nhãn dán thời tiết & Micrô ghi âm.
          files: |
            DNS.mobileconfig
