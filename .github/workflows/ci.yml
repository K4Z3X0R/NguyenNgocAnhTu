name: CI & Integrity Checks

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Modules & Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Spotify Engine Tests
        run: node .github/scripts/test_spotify.js

      - name: Run RevenueCat Engine Tests
        run: node .github/scripts/test_revenuecat.js

      - name: Run Locket 45s Engine Tests
        run: node .github/scripts/test_locket_45s.js

      - name: Run Locket Apex Verification Tests
        run: node .github/scripts/test_locket_apex_verification.js

      - name: Run Education Suite Engine Tests
        run: node .github/scripts/test_education.js

      - name: Run JS Script Resilience Tests
        run: node .github/scripts/test_all_scripts.js

      - name: Run Standalone Functional Positive Tests
        run: node .github/scripts/test_all_functional.js

      - name: Run Reality Proof End-to-End Suite
        run: node .github/scripts/test_reality_proof.js

      - name: Run Web Security Defenses & Anti-Scraping Tests
        run: node .github/scripts/test_security_defenses.js

      - name: Run Full Module & Rules Validation
        run: python .github/scripts/validate.py
