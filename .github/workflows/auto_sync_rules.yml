name: Weekly Upstream Rules Sync

on:
  schedule:
    - cron: '0 0 * * 0' # 00:00 Chủ Nhật hàng tuần (UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync Threat & Ad Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Upstream Rules Sync
        run: python .github/scripts/sync_upstream_rules.py --dry-run

      - name: Validate Integrity & Rules
        run: python .github/scripts/validate.py
